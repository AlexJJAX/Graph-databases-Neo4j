[project]
name = "graph-databases"
version = "0.1.0"
description = "A progressively layered portfolio of Neo4j-powered AI applications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "neo4j>=6.2.0",
    "neo4j-graphrag>=1.18.0",
    "openai>=2.53.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
